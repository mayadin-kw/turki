<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d14"><title>تركي مود | سينما بيتك</title>
<style>
:root{color-scheme:dark;--bg:#090d14;--panel:#111925;--panel2:#182334;--ink:#f5f4f1;--muted:#9ba7b8;--gold:#f3b431;--line:#263345}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#263448 0,transparent 42%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,76px);border-bottom:1px solid #ffffff12;background:#090d14cc;position:sticky;top:0;z-index:3;backdrop-filter:blur(16px)}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand i{font-style:normal;color:var(--gold)}.top small{color:var(--muted)}main{max-width:1320px;margin:auto;padding:30px clamp(16px,4vw,48px) 70px}.searchrow{display:flex;gap:12px;align-items:center;margin:10px 0 30px}.search{flex:1;position:relative}.search input{width:100%;height:50px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--ink);padding:0 48px 0 16px;outline:none}.search:before{content:'⌕';position:absolute;right:17px;top:7px;font-size:26px;color:var(--muted)}.filters{display:flex;gap:8px}.filters button,.quiet{border:1px solid var(--line);background:var(--panel);color:#d5dbe3;padding:12px 17px;border-radius:13px;cursor:pointer}.filters button.active{background:var(--gold);border-color:var(--gold);color:#18140b;font-weight:800}.hero{min-height:330px;border:1px solid #ffffff15;border-radius:24px;overflow:hidden;background:linear-gradient(90deg,#09111be8 0%,#09111bb9 56%,#09111b44),linear-gradient(135deg,#29384b,#111925 60%,#543e19);display:flex;align-items:end;padding:clamp(24px,5vw,54px);position:relative;margin-bottom:42px}.hero:after{content:'▶';position:absolute;left:9%;top:22%;font-size:clamp(70px,12vw,160px);color:#ffffff0a}.herocopy{position:relative;z-index:1;max-width:650px}.eyebrow{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:1px}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.15;margin:10px 0}.hero p{color:#c0c9d5;margin:0 0 22px}.primary{border:0;border-radius:12px;background:var(--gold);color:#17130a;font-weight:900;padding:13px 24px;cursor:pointer}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:32px 0 18px}.sectionhead h2{font-size:23px;margin:0}.sectionhead span{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:var(--panel);border:1px solid #ffffff12;border-radius:17px;overflow:hidden;cursor:pointer;transition:.2s transform,.2s border-color}.card:hover{transform:translateY(-4px);border-color:#f3b43188}.poster{aspect-ratio:16/10;background:linear-gradient(145deg,#25384c,#141b27 65%,#73551f);display:grid;place-items:center;color:#ffffff2b;font-size:48px;position:relative}.poster:after{content:'▶';width:48px;height:48px;border-radius:50%;background:#080c13aa;color:white;display:grid;place-items:center;font-size:16px;position:absolute}.info{padding:15px}.info h3{font-size:17px;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:13px;color:var(--muted);margin:0}.kind{display:inline-block;margin-top:11px;color:var(--gold);font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:54px 18px;background:var(--panel);border:1px dashed #344257;border-radius:18px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:7px}.detail{display:none;margin:20px 0 42px;background:var(--panel);border:1px solid #ffffff12;border-radius:22px;padding:clamp(20px,4vw,36px)}.detail.show{display:block}.detailhead{display:flex;align-items:center;gap:15px}.detailhead h2{margin:0;flex:1}.episodes{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.episode{padding:13px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);cursor:pointer}.episode:hover,.episode.selected{border-color:var(--gold);color:var(--gold)}.player{position:fixed;inset:0;background:#000e;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.player.show{display:flex}.playerbox{width:min(100%,1000px);position:relative}.player video{width:100%;max-height:82vh;background:#000;border-radius:14px}.close{position:absolute;top:-44px;left:0;border:0;background:transparent;color:#fff;font-size:30px;cursor:pointer}.hint{color:var(--muted);font-size:13px;margin-top:12px}@media(max-width:650px){.top{height:64px}.top small{display:none}.searchrow{display:block}.filters{margin-top:10px;overflow:auto}.filters button{white-space:nowrap}.hero{min-height:275px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info{padding:12px}.info h3{font-size:15px}}
.topactions{display:flex;align-items:center;gap:9px}.accountbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer}.continue{display:none;margin:0 0 38px}.continue.show{display:block}.progressbar{height:4px;background:#ffffff25;margin-top:12px;border-radius:5px;overflow:hidden}.progressbar i{display:block;height:100%;background:var(--gold)}.authveil{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:18px}.authveil.show{display:flex}.authbox{width:min(100%,420px);background:#121b28;border:1px solid #ffffff20;border-radius:22px;padding:25px;box-shadow:0 24px 90px #0009}.authbox h2{margin:0 0 8px}.authbox p{color:var(--muted);font-size:14px;margin:0 0 18px}.authbox input{display:block;width:100%;height:48px;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:#0b111b;color:white;padding:0 13px;outline:none;direction:ltr;text-align:left}.authactions{display:flex;gap:9px;margin-top:16px}.authactions button{flex:1}.switchauth{border:0;background:transparent;color:var(--gold);cursor:pointer;padding:14px 0 0}.autherror{min-height:20px;color:#ff9b91;font-size:13px}@media(max-width:650px){.top{height:64px}.top small{display:none}.accountbtn{padding:9px 10px;font-size:13px}.brand{font-size:20px}}</style></head><body>
<header class="top"><div class="brand">تركي <i>مود</i></div><small>اختياراتك المعروضة من الريموت، في مكان واحد</small><div class="topactions"><button class="accountbtn" id="continueBtn">متابعة المشاهدة</button><button class="accountbtn" id="accountBtn">تسجيل الدخول</button></div></header>
<main><div class="searchrow"><label class="search"><input id="search" type="search" placeholder="ابحث عن فيلم أو مسلسل أو حلقة" autocomplete="off"></label><div class="filters"><button class="active" data-filter="all">الكل</button><button data-filter="series">مسلسلات</button><button data-filter="movie">أفلام</button></div></div>
<section class="hero" id="hero"><div class="herocopy"><div class="eyebrow">الأحدث في تركي مود</div><h1 id="heroTitle">أهلاً بك في تركي مود</h1><p id="heroDesc">أرسل فيديو إلى المنصة من تطبيق الريموت ليظهر هنا.</p><button class="primary" id="heroPlay" hidden>▶　شاهد الآن</button></div></section>
<section class="detail" id="detail"><div class="detailhead"><button class="quiet" id="detailBack">رجوع</button><h2 id="detailTitle"></h2><span id="detailKind" class="eyebrow"></span></div><div class="episodes" id="episodes"></div></section>
<section class="continue" id="continueSection"><div class="sectionhead"><h2>متابعة المشاهدة</h2><span>أكمل من حيث توقفت</span></div><div class="grid" id="continueGrid"></div></section><div class="sectionhead"><h2 id="sectionTitle">أضيف حديثاً</h2><span id="count"></span></div><section class="grid" id="grid"><div class="empty"><b>لحظة واحدة…</b>جارٍ تحميل مكتبتك</div></section>
</main><div class="authveil" id="auth"><div class="authbox"><h2 id="authTitle">تسجيل الدخول</h2><p id="authDesc">سجّل الدخول لمتابعة أفلامك وحلقاتك.</p><form id="authForm"><input id="authUser" autocomplete="username" placeholder="اسم المستخدم" maxlength="30" required><input id="authPass" type="password" autocomplete="current-password" placeholder="كلمة السر" required><input id="authConfirm" type="password" autocomplete="new-password" placeholder="تكرار كلمة السر" hidden><div class="autherror" id="authError"></div><div class="authactions"><button class="quiet" type="button" id="authClose">إغلاق</button><button class="primary" id="authSubmit" type="submit">دخول</button></div></form><button class="switchauth" id="authSwitch">إنشاء حساب جديد</button></div></div><div class="player" id="player"><div class="playerbox"><button class="close" id="close">×</button><video id="video" controls playsinline preload="metadata"></video><div class="hint" id="playHint"></div></div></div>
<script>
const SERVER='https://tv.162-35-27-249.sslip.io';let items=[],filter='all',query='',token=localStorage.getItem('turkiToken')||'',user=null,progress=[],view='catalog',authMode='login',afterAuth=null,activeItem=null,lastSaved=0;
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function authHeaders(){return token?{Authorization:'Bearer '+token}:{}}
async function api(path,opts={}){const headers={...(opts.headers||{}),...authHeaders()};return fetch(SERVER+path,{...opts,headers})}
function groups(){const map=new Map();for(const x of items){const k=(x.kind||'movie')+'|'+(x.workTitle||x.sourceTitle||'فيديو');if(!map.has(k))map.set(k,{key:k,title:x.workTitle||x.sourceTitle||'فيديو',kind:x.kind||'movie',items:[]});map.get(k).items.push(x)}return [...map.values()].map(g=>({...g,items:g.items.sort((a,b)=>b.created-a.created)})).sort((a,b)=>b.items[0].created-a.items[0].created)}
function visibleGroups(){return groups().filter(g=>{const matchesFilter=filter==='all'||g.kind===filter;const text=(g.title+' '+g.items.map(x=>x.episode+' '+x.sourceTitle).join(' ')).toLowerCase();return matchesFilter&&(!query||text.includes(query.toLowerCase()))})}
function requireLogin(action){if(user){action?.();return true}afterAuth=action||null;showAuth();return false}
function showAuth(){authMode='login';$('#auth').classList.add('show');setAuthMode();$('#authError').textContent='';}
function setAuthMode(){const reg=authMode==='register';$('#authTitle').textContent=reg?'إنشاء حساب':'تسجيل الدخول';$('#authDesc').textContent=reg?'اسم مستخدم فريد، وكلمة سر لا تقل عن 8 أحرف.':'سجّل الدخول لمتابعة أفلامك وحلقاتك.';$('#authSubmit').textContent=reg?'إنشاء الحساب':'دخول';$('#authSwitch').textContent=reg?'لديك حساب؟ تسجيل الدخول':'إنشاء حساب جديد';$('#authConfirm').hidden=!reg;$('#authPass').autocomplete=reg?'new-password':'current-password';}
function updateHeader(){$('#accountBtn').textContent=user?'@'+user.username+' · خروج':'تسجيل الدخول'}
async function loadProgress(){if(!user){progress=[];return}try{const r=await api('/api/progress');const j=await r.json();progress=r.ok?j.progress||[]:[]}catch{progress=[]}}
function cardMarkup(x,sub=''){const pct=x.duration?Math.max(0,Math.min(100,x.position/x.duration*100)):0;return `<article class="card" data-id="${esc(x.id)}"><div class="poster">▶</div><div class="info"><h3>${esc(x.workTitle||x.sourceTitle||'فيديو')}</h3><p>${esc(x.episode||'أضيف حديثاً')}${sub?' · '+sub:''}</p><div class="progressbar"><i style="width:${pct}%"></i></div></div></article>`}
function render(){const gs=visibleGroups();$('#count').textContent=gs.length+' عنوان';$('#sectionTitle').textContent=query?'نتائج البحث':'أضيف حديثاً';$('#accountBtn').textContent=user?'@'+user.username+' · خروج':'تسجيل الدخول';$('#hero').hidden=view==='continue';document.querySelector('.searchrow').hidden=view==='continue';$('#grid').hidden=view==='continue';$('#sectionTitle').parentElement.hidden=view==='continue';$('#continueSection').classList.toggle('show',view==='continue');if(view==='continue'){const g=$('#continueGrid');const rows=progress.map(p=>({...p,item:items.find(x=>x.id===p.id)})).filter(x=>x.item);g.innerHTML=rows.length?rows.map(x=>cardMarkup({...x.item,position:x.position,duration:x.duration},'متبقي '+formatTime(Math.max(0,x.duration-x.position)))).join(''):'<div class="empty"><b>لا توجد حلقات قيد المتابعة</b>ابدأ مشاهدة أي عمل وسيظهر هنا موضع توقفك.</div>';g.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const row=rows.find(x=>x.id===c.dataset.id);if(row)start(row.item,row.position)});return}
if(items[0]){$('#heroTitle').textContent=items[0].workTitle||items[0].sourceTitle||'فيديو جديد';$('#heroDesc').textContent=(items[0].episode?items[0].episode+' · ':'')+'أضيف إلى المنصة للتو';$('#heroPlay').hidden=false;$('#heroPlay').onclick=()=>requireLogin(()=>openDetail(groups().find(g=>g.items.some(x=>x.id===items[0].id)),items[0]));}else{$('#heroTitle').textContent='أهلاً بك في تركي مود';$('#heroDesc').textContent='أرسل فيديو إلى المنصة من تطبيق الريموت ليظهر هنا.';$('#heroPlay').hidden=true}
if(!gs.length){$('#grid').innerHTML='<div class="empty"><b>'+(items.length?'ما لقينا نتائج':'مكتبتك جاهزة')+'</b>'+(items.length?'جرّب كلمة بحث أخرى أو غيّر التصنيف.':'افتح صفحة فيديو في تطبيق الريموت واضغط «عرض في المنصة» لإضافته هنا.')+'</div>';return}$('#grid').innerHTML=gs.map(g=>`<article class="card" data-key="${esc(g.key)}"><div class="poster">▶</div><div class="info"><h3>${esc(g.title)}</h3><p>${g.items.length} ${g.kind==='series'?'حلقة':'نسخة'} · ${g.items[0].episode?esc(g.items[0].episode):'أضيف حديثاً'}</p><span class="kind">${g.kind==='series'?'مسلسل':'فيلم'}</span></div></article>`).join('');$('#grid').querySelectorAll('.card').forEach(el=>el.onclick=()=>requireLogin(()=>openDetail(gs.find(g=>g.key===el.dataset.key))));}
function formatTime(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function openDetail(g,play){if(!g)return;$('#detail').classList.add('show');$('#detailTitle').textContent=g.title;$('#detailKind').textContent=g.kind==='series'?'مسلسل':'فيلم';const ep=$('#episodes');ep.innerHTML=g.items.map(x=>`<button class="episode ${play&&play.id===x.id?'selected':''}" data-id="${esc(x.id)}">${esc(x.episode||'تشغيل الفيلم')}</button>`).join('');ep.querySelectorAll('button').forEach(b=>b.onclick=()=>requireLogin(()=>start(g.items.find(x=>x.id===b.dataset.id))));$('#detail').scrollIntoView({behavior:'smooth',block:'start'});if(play)start(play)}
async function start(x,resume){if(!requireLogin(()=>start(x,resume)))return;try{const r=await api('/api/library/'+encodeURIComponent(x.id)+'/ticket',{method:'POST'});const j=await r.json();if(!r.ok||!j.ok)throw Error();activeItem=x;lastSaved=0;const v=$('#video');v.src=SERVER+'/api/library/'+encodeURIComponent(x.id)+'/stream?ticket='+encodeURIComponent(j.ticket);$('#playHint').textContent=x.workTitle+(x.episode?' · '+x.episode:'');$('#player').classList.add('show');if(resume>0){v.addEventListener('loadedmetadata',()=>{v.currentTime=resume;v.play().catch(()=>{})},{once:true})}else v.play().catch(()=>{});}catch{$('#playHint').textContent='تعذر تشغيل الفيديو من الخادم';$('#player').classList.add('show')}}
async function savePosition(){const v=$('#video');if(!user||!activeItem||!Number.isFinite(v.duration)||v.duration<=0)return;const now=Date.now();if(now-lastSaved<7000&& !v.paused && !v.ended)return;lastSaved=now;try{await api('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:activeItem.id,position:v.currentTime,duration:v.duration})});}catch{}}
async function closePlayer(){await savePosition();const v=$('#video');v.pause();v.removeAttribute('src');v.load();$('#player').classList.remove('show');activeItem=null;await loadProgress();render()}
$('#video').addEventListener('timeupdate',savePosition);$('#video').addEventListener('pause',savePosition);$('#video').addEventListener('ended',savePosition);$('#close').onclick=closePlayer;$('#player').onclick=e=>{if(e.target===$('#player'))closePlayer()};$('#detailBack').onclick=()=>$('#detail').classList.remove('show');$('#search').oninput=e=>{query=e.target.value;render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));filter=b.dataset.filter;render()});
$('#continueBtn').onclick=()=>requireLogin(async()=>{view='continue';await loadProgress();render();window.scrollTo({top:0,behavior:'smooth'})});$('#accountBtn').onclick=()=>{if(user){api('/api/auth/logout',{method:'POST'}).catch(()=>{});localStorage.removeItem('turkiToken');token='';user=null;progress=[];view='catalog';render()}else showAuth()};$('#authClose').onclick=()=>{$('#auth').classList.remove('show');afterAuth=null};$('#auth').onclick=e=>{if(e.target===$('#auth'))$('#authClose').click()};$('#authSwitch').onclick=()=>{authMode=authMode==='login'?'register':'login';$('#authError').textContent='';setAuthMode()};
$('#authForm').onsubmit=async e=>{e.preventDefault();const username=$('#authUser').value.trim(),password=$('#authPass').value,confirm=$('#authConfirm').value;const re=/^(?![._])(?!.*\.\.)[A-Za-z0-9._]{3,30}(?<![._])$/;if(authMode==='register'&&!re.test(username)){ $('#authError').textContent='اسم المستخدم 3–30 حرفاً: إنجليزي أو أرقام أو نقطة أو شرطة سفلية.';return}if(authMode==='register'&&password!==confirm){$('#authError').textContent='كلمتا السر غير متطابقتين.';return}if(authMode==='register'&&password.length<8){$('#authError').textContent='كلمة السر يجب ألا تقل عن 8 أحرف.';return}try{const r=await fetch(SERVER+'/api/auth/'+(authMode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const j=await r.json();if(!r.ok)throw Error(j.error||'تعذر تسجيل الدخول');token=j.token;user=j.user;localStorage.setItem('turkiToken',token);$('#auth').classList.remove('show');const action=afterAuth;afterAuth=null;await loadProgress();render();action?.()}catch(err){const msg=err.message==='username_taken'?'اسم المستخدم مستخدم بالفعل، اختر اسماً آخر.':err.message==='invalid_credentials'?'اسم المستخدم أو كلمة السر غير صحيحة.':err.message==='username_format'?'اسم المستخدم غير مطابق للمعايير.':err.message==='password_length'?'كلمة السر يجب أن تكون من 8 إلى 128 حرفاً.':'تعذر إكمال الطلب؛ تحقق من اتصال الخادم.';$('#authError').textContent=msg}};
async function load(){try{const r=await fetch(SERVER+'/api/library',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw Error();items=(j.items||[]).sort((a,b)=>b.created-a.created);if(token){try{const me=await api('/api/auth/me');if(me.ok){user=(await me.json()).user;await loadProgress()}else{token='';localStorage.removeItem('turkiToken')}}catch{}}render()}catch{$('#grid').innerHTML='<div class="empty"><b>تعذر الاتصال بالمكتبة</b>تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.</div>'}}load();setInterval(load,30000);
</script>
</body></html>
